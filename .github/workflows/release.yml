name: Release

on:
  # Manual tag pushes (legacy/human) still build directly.
  push:
    tags:
      # release-please tags this package's releases with the component
      # prefix (e.g. camouflage-tui-v1.1.0-beta.1). The legacy bare `v*`
      # tag is kept so older-style/manual tags still build binaries.
      - "camouflage-tui-v*"
      - "v*"
  # Called by release-please.yml after it cuts a release. This is the
  # primary path: release-please pushes the tag with GITHUB_TOKEN, and
  # GitHub will NOT trigger a `push` workflow from a GITHUB_TOKEN event, so
  # the tag push above never fires for automated releases. Chaining via
  # workflow_call (from the human-triggered release-please run) builds the
  # binaries without needing a PAT.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Manual recovery: build + attach binaries for any existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. camouflage-tui-v1.1.1-beta.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      # Build from the tagged commit regardless of how we were triggered
      # (push → github.ref_name; workflow_call/dispatch → inputs.tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release --target ${{ matrix.target }} -p camouflage-tui

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --locked --release --target ${{ matrix.target }} -p camouflage-tui

      - name: Strip binary
        if: runner.os != 'Windows'
        run: |
          BINARY=target/${{ matrix.target }}/release/camouflage-tui
          if command -v strip &>/dev/null; then
            strip "$BINARY" 2>/dev/null || true
          fi

      - name: Package
        shell: bash
        run: |
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          BINARY=target/${{ matrix.target }}/release/camouflage-tui$EXE
          ARCHIVE=camouflage-tui-${{ matrix.target }}.tar.gz
          tar czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: camouflage-tui-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*.tar.gz"
          # Attach to the explicit tag so this works under workflow_call /
          # workflow_dispatch (where github.ref is a branch, not the tag).
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Release notes are generated by release-please; this job only
          # attaches the pre-built binaries to the existing release.
