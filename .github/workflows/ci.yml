name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK tests
        working-directory: sdk/node
        run: npm test

  # The release builds Windows and Intel Mac binaries; make sure every PR
  # still compiles for them. Windows has no pseudo-terminal tests.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: cargo test -p camouflage-inline -p camouflage-protocol
          - os: macos-14
            target: x86_64-apple-darwin
            test: "true"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} -p camouflage-tui
      - run: ${{ matrix.test }}
