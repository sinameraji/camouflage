name: release-please

on:
  push:
    branches:
      - main
  # Recovery: publish an existing release to npm (e.g. after fixing npm
  # auth). Binaries for it can be (re)built with the Release workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. camouflage-tui-v2.2.1-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required for npm provenance

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # The package lives at the repo root ("."), so outputs are unprefixed.
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build + attach the platform binaries for the release release-please just
  # cut. This runs via workflow_call (not the tag-push trigger in release.yml)
  # because release-please pushes the tag with GITHUB_TOKEN, and GitHub does
  # not trigger `push` workflows from GITHUB_TOKEN events. Chaining here — off
  # the human merge that triggered this workflow — builds the binaries with no
  # PAT required.
  build-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Publish to npm after the binaries are attached to the GitHub release:
  # the package's install script downloads them from there, so publishing
  # first would give early installers a missing binary.
  #
  # Auth: npm trusted publishing (OIDC, configured on npmjs.com for this
  # repo and this workflow file) needs npm >= 11.5.1, installed below. If an
  # NPM_TOKEN secret is set it's used as a fallback.
  #
  # The version is read from package.json at the tag. Publishing is
  # idempotent: an already-published version is skipped. Pre-releases go
  # to the "beta" dist-tag, stable releases to "latest".
  publish:
    needs: [release-please, build-binaries]
    if: >-
      ${{ always() && (
        (github.event_name == 'push' && needs.release-please.outputs.releases_created == 'true' && needs.build-binaries.result == 'success')
        || github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
