name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required for npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.releases_created }}

      # Publish to npm. The version is read from package.json (which
      # release-please bumped in the released commit) rather than from the
      # action's `version` output, which is empty in manifest mode — that
      # emptiness is what previously mislabeled a beta as `latest`.
      #
      # The publish is idempotent: if the exact version is already on the
      # registry we skip instead of failing. npm rejects re-publishing an
      # existing version with a 403, which used to break this job whenever
      # the workflow re-ran for an already-released version.
      #
      # Pre-releases (e.g. 1.0.1-beta.1) publish under the "beta" tag;
      # stable releases publish under "latest".
      - run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.releases_created }}
