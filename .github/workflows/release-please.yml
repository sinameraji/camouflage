name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write   # required for npm provenance

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.releases_created }}

      # Publish to npm. The version is read from package.json (which
      # release-please bumped in the released commit) rather than from the
      # action's `version` output, which is empty in manifest mode — that
      # emptiness is what previously mislabeled a beta as `latest`.
      #
      # The publish is idempotent: if the exact version is already on the
      # registry we skip instead of failing. npm rejects re-publishing an
      # existing version with a 403, which used to break this job whenever
      # the workflow re-ran for an already-released version.
      #
      # Pre-releases (e.g. 1.0.1-beta.1) publish under the "beta" tag;
      # stable releases publish under "latest".
      - run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published — skipping."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        working-directory: sdk/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.releases_created }}

      # release-please only tracks the sdk/node package path, but the
      # published binary is built from crates/**. A user-facing change to the
      # Rust TUI (a `fix:`/`feat:` under crates/) therefore does NOT trigger a
      # release on its own — and that silent skip is exactly what bit the
      # Esc-abort fix. When no release is cut, surface any unreleased crate
      # changes loudly so they aren't lost. Non-blocking: warning only.
      - uses: actions/checkout@v4
        if: ${{ !steps.release.outputs.releases_created }}
        with:
          fetch-depth: 0
      - name: Warn on unreleased crate changes
        if: ${{ !steps.release.outputs.releases_created }}
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'camouflage-tui-v*' 2>/dev/null \
            || git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -z "$last_tag" ]; then
            echo "No prior release tag found; nothing to compare."
            exit 0
          fi
          changes="$(git log "${last_tag}..HEAD" --format='%s' -- crates \
            | grep -E '^(feat|fix)(\(.+\))?!?:' || true)"
          if [ -n "$changes" ]; then
            {
              echo "### ⚠️ Unreleased crate changes since ${last_tag}"
              echo ""
              echo "release-please tracks only \`sdk/node\`, so these user-facing crate"
              echo "commits will NOT ship a new \`camouflage-tui\` binary until a release is"
              echo "forced. Run \`scripts/trigger-binary-release.sh <next-version>\` from a"
              echo "branch off \`main\` to cut one."
              echo ""
              echo '```'
              echo "${changes}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unreleased user-facing crate changes since ${last_tag}. See the job summary; run scripts/trigger-binary-release.sh to publish a new binary."
          else
            echo "No unreleased user-facing crate changes since ${last_tag}."
          fi
